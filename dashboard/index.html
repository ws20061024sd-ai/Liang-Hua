<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化交易仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
    --text: #e1e4ed; --dim: #8b8fa3; --green: #26a69a; --red: #ef5350;
    --blue: #42a5f5; --orange: #ffa726; --purple: #ab47bc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; min-height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .updated { color: var(--dim); font-size: 13px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h3 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); } .orange { color: var(--orange); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .badge-ok { background: #1b3a2d; color: var(--green); }
  .badge-warn { background: #3a2d1b; color: var(--orange); }
  .badge-buy { background: #1b3a2d; color: var(--green); }
  .badge-sell { background: #3a1b1b; color: var(--red); }
  .badge-passed { background: #1b2d3a; color: var(--blue); }
  .badge-blocked { background: #2d2d1b; color: var(--orange); }
  .badge-trend { background: #1b2d3a; color: var(--blue); }
  .badge-reversion { background: #2d1b3a; color: var(--purple); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 6px; border-bottom: 1px solid var(--border); }
  tr:hover { background: rgba(255,255,255,0.03); }
  .chart-wrap { position: relative; height: 250px; }
  .chart-wrap-sm { height: 200px; }
  .empty { color: var(--dim); text-align: center; padding: 32px; font-size: 14px; }
  .position-card { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; }
  .position-card .code { font-weight: 700; font-size: 16px; }
  .position-card .pnl { font-size: 20px; font-weight: 700; }
  @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>📊 量化交易仪表盘</h1>
  <span class="updated" id="updated">加载中...</span>
</div>

<!-- 市场 + 数据健康 -->
<div class="grid grid-2" style="margin-bottom:16px">
  <div class="card">
    <h3>📈 市场状态</h3>
    <div class="stat-row"><span>数据日期</span><span class="stat-value" id="mkt-date">--</span></div>
    <div class="stat-row"><span>覆盖股票</span><span class="stat-value" id="mkt-stocks">--</span></div>
    <div class="stat-row"><span>市场状态</span><span class="stat-value" id="mkt-regime">--</span></div>
    <div class="stat-row"><span>20日涨跌</span><span class="stat-value" id="mkt-ret20d">--</span></div>
    <div class="chart-wrap-sm"><canvas id="chart-index"></canvas></div>
  </div>
  <div class="card">
    <h3>🩺 数据健康</h3>
    <div class="stat-row"><span>日线数据</span><span id="health-daily">--</span></div>
    <div class="stat-row"><span>PE 覆盖率</span><span id="health-pe">--</span></div>
    <div class="stat-row"><span>PB 覆盖率</span><span id="health-pb">--</span></div>
    <div class="stat-row"><span>ROE 覆盖率</span><span id="health-roe">--</span></div>
    <div class="stat-row"><span>数据库大小</span><span class="stat-value" id="health-size">--</span></div>
    <div style="margin-top:16px">
      <span class="badge badge-ok" id="health-overall">等待数据</span>
    </div>
  </div>
</div>

<!-- 策略表现 + 因子Top10 -->
<div class="grid grid-2" style="margin-bottom:16px">
  <div class="card">
    <h3>📋 三策略回测表现</h3>
    <div class="chart-wrap"><canvas id="chart-strategies"></canvas></div>
  </div>
  <div class="card">
    <h3>🔝 多因子引擎 Top 10</h3>
    <div id="factors-container"></div>
  </div>
</div>

<!-- 持仓 + 信号 -->
<div class="grid grid-2" style="margin-bottom:16px">
  <div class="card">
    <h3>💼 当前持仓</h3>
    <div id="positions-container"></div>
  </div>
  <div class="card">
    <h3>📡 最近信号</h3>
    <div id="signals-container" style="max-height:400px;overflow-y:auto"></div>
  </div>
</div>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('updated').textContent = '更新于 ' + new Date(data.generated_at).toLocaleString('zh-CN');
    renderMarket(data.market);
    renderHealth(data.data_health);
    renderStrategies(data.strategies);
    renderFactors(data.factors);
    renderPositions(data.positions);
    renderSignals(data.signals);
    renderIndexChart(data.market.index_trend);
  })
  .catch(e => {
    document.getElementById('updated').textContent = '数据加载失败: ' + e.message;
    document.querySelectorAll('.card').forEach(c => c.style.opacity = '0.5');
  });

function renderMarket(m) {
  document.getElementById('mkt-date').textContent = m.date;
  document.getElementById('mkt-stocks').textContent = m.stocks + ' 只';
  document.getElementById('mkt-regime').innerHTML = m.regime_label;
  const ret = m.ret_20d;
  const el = document.getElementById('mkt-ret20d');
  el.textContent = (ret > 0 ? '+' : '') + ret + '%';
  el.className = 'stat-value ' + (ret >= 0 ? 'green' : 'red');
}

function renderHealth(h) {
  const ok = (v) => v === 'ok';
  document.getElementById('health-daily').innerHTML =
    `<span class="badge ${ok(h.daily.status)?'badge-ok':'badge-warn'}">${h.daily.stocks}只 | NULL:${h.daily.nulls}</span>`;
  document.getElementById('health-pe').innerHTML =
    `<span class="badge ${ok(h.pe.status)?'badge-ok':'badge-warn'}">${h.pe.coverage}%</span>`;
  document.getElementById('health-pb').innerHTML =
    `<span class="badge ${ok(h.pb.status)?'badge-ok':'badge-warn'}">${h.pb.coverage}%</span>`;
  document.getElementById('health-roe').innerHTML =
    `<span class="badge ${ok(h.roe.status)?'badge-ok':'badge-warn'}">${h.roe.stocks}只 (${h.roe.date})</span>`;
  document.getElementById('health-size').textContent = h.db_size_mb + ' MB';
  const allOk = ok(h.daily.status) && ok(h.pe.status) && ok(h.pb.status) && ok(h.roe.status);
  const overall = document.getElementById('health-overall');
  overall.textContent = allOk ? '✅ 全部健康' : '⚠️ 部分异常';
  overall.className = 'badge ' + (allOk ? 'badge-ok' : 'badge-warn');
}

function renderStrategies(strats) {
  new Chart(document.getElementById('chart-strategies'), {
    type: 'bar',
    data: {
      labels: strats.map(s => s.name),
      datasets: [
        { label: '年化收益 %', data: strats.map(s => s.ann_ret), backgroundColor: '#26a69a80', borderColor: '#26a69a', borderWidth: 1 },
        { label: '最大回撤 %', data: strats.map(s => -s.max_dd), backgroundColor: '#ef535080', borderColor: '#ef5350', borderWidth: 1 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8b8fa3' } } },
      scales: {
        x: { ticks: { color: '#8b8fa3', maxRotation: 30 } },
        y: { ticks: { color: '#8b8fa3', callback: v => v + '%' }, grid: { color: '#2a2d3a' } }
      }
    }
  });
}

function renderFactors(factors) {
  const c = document.getElementById('factors-container');
  if (!factors || factors.length === 0 || factors[0].error) {
    c.innerHTML = '<div class="empty">暂无因子数据</div>'; return;
  }
  c.innerHTML = `<table><thead><tr><th>#</th><th>代码</th><th>名称</th><th>得分</th><th>动量</th><th>波动</th></tr></thead><tbody>${
    factors.map(f => `<tr>
      <td>${f.rank}</td><td style="font-weight:600">${f.code}</td><td>${f.name}</td>
      <td class="stat-value">${f.score}</td>
      <td>${f.momentum ?? '--'}</td><td>${f.volatility ?? '--'}</td>
    </tr>`).join('')
  }</tbody></table>`;
}

function renderPositions(positions) {
  const c = document.getElementById('positions-container');
  if (!positions || positions.length === 0) {
    c.innerHTML = '<div class="empty">📭 当前无持仓</div>'; return;
  }
  c.innerHTML = positions.map(p => `
    <div class="position-card">
      <div style="flex:1">
        <div class="code">${p.code} <span style="font-size:13px;color:var(--dim)">${p.name}</span></div>
        <div style="font-size:12px;color:var(--dim)">买入: ${p.buy_date} @ ¥${p.buy_price}</div>
        <div style="font-size:11px;color:var(--dim)">止损线: ¥${p.stop_level} (最高 ¥${p.peak})</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:14px">现价 ¥${p.current}</div>
        <div class="pnl ${p.pnl_pct >= 0 ? 'green' : 'red'}">${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct}%</div>
      </div>
    </div>
  `).join('');
}

function renderSignals(signals) {
  const c = document.getElementById('signals-container');
  if (!signals || signals.length === 0) {
    c.innerHTML = '<div class="empty">暂无信号记录</div>'; return;
  }
  // 按日期分组
  const grouped = {};
  signals.forEach(s => {
    if (!grouped[s.date]) grouped[s.date] = [];
    grouped[s.date].push(s);
  });
  let html = '';
  for (const [date, sigs] of Object.entries(grouped).slice(0, 5)) {
    html += `<div style="font-size:12px;color:var(--dim);padding:4px 0;font-weight:600">${date} (${sigs.length}条)</div>`;
    sigs.slice(0, 8).forEach(s => {
      const actionBadge = s.action === 'BUY' ? 'badge-buy' : 'badge-sell';
      const statusBadge = s.status === 'passed' ? 'badge-passed' : 'badge-blocked';
      html += `<div class="stat-row" style="font-size:12px">
        <span>${s.code} ${s.name}</span>
        <span style="font-size:11px;color:var(--dim)">${s.strategy}</span>
        <span class="badge ${actionBadge}">${s.action}</span>
        <span>¥${s.price}</span>
        <span class="badge ${statusBadge}">${s.status}</span>
      </div>`;
    });
  }
  c.innerHTML = html;
}

function renderIndexChart(trend) {
  if (!trend || trend.length < 5) return;
  const labels = trend.map(t => t.date);
  const closes = trend.map(t => t.close);
  new Chart(document.getElementById('chart-index'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'CSI300', data: closes,
        borderColor: '#42a5f5', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b8fa3', maxTicksLimit: 6, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a' } }
      }
    }
  });
}
</script>
</body>
</html>
