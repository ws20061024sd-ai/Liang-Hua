/* ── Geo-blobs 装饰（博客 Hero 同款）── */
.geo-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.10;pointer-events:none}

/* ── 导航栏（对齐博客 Header）── */

nav .inner{max-width:768px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px}
nav .brand{font-weight:600;font-size:18px;letter-spacing:-.02em;color:var(--text);text-decoration:none;transition:opacity .15s}
nav .brand:hover{opacity:0.7}
nav .links{display:flex;align-items:center;gap:4px}
nav .links a{color:var(--text-muted);text-decoration:none;padding:6px 12px;font-size:14px;font-weight:500;border-radius:6px;transition:all .15s}

.theme-btn:hover{color:var(--text);background:var(--border-light)}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="light"] .icon-moon{display:none}

main{max-width:768px;margin:0 auto;padding:24px 16px 48px;position:relative}

<script>function toggleTheme(){var d=document.documentElement;var n=d.getAttribute("data-theme")==="dark"?"light":"dark";d.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}}</script>
<script>
(function(){
  var tip=null;
  function fmt(v){return v||'—'}
  function show(ev){
    var t=ev.target;
    var d=t.getAttribute('data-date');if(!d)return;
    var o=t.getAttribute('data-o'),h=t.getAttribute('data-h'),l=t.getAttribute('data-l'),
        c=t.getAttribute('data-c'),p=parseFloat(t.getAttribute('data-pct')),v=t.getAttribute('data-vol');
    var cls=(p>=0?'up':'dn');
    tip.innerHTML='<div class="kt-date">'+d+' <span class="'+cls+'">'+(p>=0?'+':'')+p.toFixed(2)+'%</span></div>'
      +'<div class="kt-row"><span>开</span><b>'+fmt(o)+'</b><span>高</span><b>'+fmt(h)+'</b></div>'
      +'<div class="kt-row"><span>低</span><b>'+fmt(l)+'</b><span>收</span><b>'+fmt(c)+'</b></div>'
      +'<div class="kt-row"><span>量</span><b>'+fmt(v)+'</b></div>';
    tip.style.display='block';
    tip.style.left=(ev.clientX+12)+'px';
    tip.style.top=(ev.clientY-10)+'px';
    if(tip.getBoundingClientRect().right>window.innerWidth){tip.style.left=(ev.clientX-160)+'px';}
  }
  function hide(){if(tip)tip.style.display='none';}
  document.addEventListener('DOMContentLoaded',function(){
    var svgs=document.querySelectorAll('svg[data-kline]');
    if(!svgs.length)return;
    tip=document.createElement('div');tip.className='kline-tip';document.body.appendChild(tip);
    svgs.forEach(function(svg){
      svg.querySelectorAll('rect[data-date]').forEach(function(r){
        r.addEventListener('mousemove',show);
        r.addEventListener('mouseleave',hide);
        r.addEventListener('click',show);
        r.addEventListener('touchstart',function(ev){show(ev);ev.preventDefault();});
      });
    });
  });
})();
</script>
